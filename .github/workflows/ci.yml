name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: restaurant
  IMAGE_NAME: restaurant
  APP_PORT: "8083"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: restaurant_test
          MYSQL_USER: restaurant
          MYSQL_PASSWORD: restaurant
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3307/restaurant_test
      TEST_DATABASE_USERNAME: restaurant
      TEST_DATABASE_PASSWORD: restaurant
      TEST_DATABASE_ADMIN_URL: jdbc:mysql://127.0.0.1:3307/mysql
      TEST_DATABASE_ADMIN_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/restaurant_test
      SPRING_DATASOURCE_USERNAME: restaurant
      SPRING_DATASOURCE_PASSWORD: restaurant
      JWT_ACCESS_SECRET_KEY: github-actions-access-secret-key-at-least-32-bytes
      JWT_REFRESH_SECRET_KEY: github-actions-refresh-secret-key-at-least-32-bytes
      RESEND_API_KEY: github-actions-placeholder
      RESEND_DOMAIN_EMAIL: no-reply@example.com
      FRONT_BASE_URL: http://localhost:3000
      SERVER_PATH: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:3000
      SECURITY_COOKIE_LOCAL: "true"
      PAYMENT_MONOBANK_X_TOKEN: github-actions-placeholder
      PAYMENT_MONOBANK_REDIRECT_URL: https://example.com/accanto/success-redirect
      PAYMENT_MONOBANK_WEBHOOK_URL: http://localhost:8080/payments/monobank/webhook
      PAYMENT_STRIPE_SECRET_KEY: github-actions-placeholder
      PAYMENT_STRIPE_SUCCESS_URL: https://example.com/accanto/stripe-success
      PAYMENT_STRIPE_CANCEL_URL: https://example.com/accanto/stripe-cancel
      PAYMENT_STRIPE_WEBHOOK_SECRET: github-actions-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify business paths and package application
        run: ./mvnw -B -Pcoverage verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t "$IMAGE_NAME:latest" .

      - name: Deploy application on Hetzner
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_APP_DEPLOY_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
          JWT_ACCESS_SECRET_KEY: ${{ secrets.JWT_ACCESS_SECRET_KEY }}
          JWT_REFRESH_SECRET_KEY: ${{ secrets.JWT_REFRESH_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_DOMAIN_EMAIL: restaurant@adammudrak.pp.ua
          FRONT_BASE_URL: https://irynamariiko-frontend.accanto.adammudrak.pp.ua
          SERVER_PATH: https://accanto.adammudrak.pp.ua
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SECURITY_COOKIE_LOCAL: ${{ secrets.SECURITY_COOKIE_LOCAL }}
          PAYMENT_MONOBANK_X_TOKEN: ${{ secrets.PAYMENT_MONOBANK_X_TOKEN }}
          PAYMENT_MONOBANK_REDIRECT_URL: https://example.com/accanto/success-redirect
          PAYMENT_MONOBANK_WEBHOOK_URL: https://accanto.adammudrak.pp.ua/payments/monobank/webhook
          PAYMENT_STRIPE_SECRET_KEY: ${{ secrets.PAYMENT_STRIPE_SECRET_KEY }}
          PAYMENT_STRIPE_SUCCESS_URL: https://example.com/accanto/stripe-success
          PAYMENT_STRIPE_CANCEL_URL: https://example.com/accanto/stripe-cancel
          PAYMENT_STRIPE_WEBHOOK_SECRET: ${{ secrets.PAYMENT_STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' 'hetzner-portfolio ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMrovpL5gc3TM4fs2+cVTggnYomFUO+ex9st5t1GHlB5' > ~/.ssh/known_hosts
          key="$HOME/.ssh/hetzner_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"

          HETZNER_HOST="$(printf '%s' "$HETZNER_HOST" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          HETZNER_PORT="$(printf '%s' "$HETZNER_PORT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          image="$APP_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:latest" "$image"
          {
            python3 -c 'import json, os, sys; print(json.dumps({key: os.environ[key].strip() for key in sys.argv[1:] if os.environ.get(key, "").strip()}))' JWT_ACCESS_SECRET_KEY JWT_REFRESH_SECRET_KEY RESEND_API_KEY RESEND_DOMAIN_EMAIL FRONT_BASE_URL SERVER_PATH ALLOWED_ORIGINS SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD SECURITY_COOKIE_LOCAL PAYMENT_MONOBANK_X_TOKEN PAYMENT_MONOBANK_REDIRECT_URL PAYMENT_MONOBANK_WEBHOOK_URL PAYMENT_STRIPE_SECRET_KEY PAYMENT_STRIPE_SUCCESS_URL PAYMENT_STRIPE_CANCEL_URL PAYMENT_STRIPE_WEBHOOK_SECRET
            docker save "$image"
          } | ssh -T -p "$HETZNER_PORT" -i "$key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=hetzner-portfolio -o HostKeyAlgorithms=ssh-ed25519 \
            "root@$HETZNER_HOST" "deploy $GITHUB_SHA"
