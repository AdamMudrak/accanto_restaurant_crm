# App
spring.application.name=restaurant
spring.config.import=optional:file:.env.local[.properties]

# App URLs
front.base.url=${FRONT_BASE_URL}
server.path=${SERVER_PATH}
allowed.origins=${ALLOWED_ORIGINS}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.drop-first=true

# JWT
security.jwt.access.secret.key=${JWT_ACCESS_SECRET_KEY}
security.jwt.refresh.secret.key=${JWT_REFRESH_SECRET_KEY}
security.jwt.access.expiration=15m
security.jwt.refresh.expiration=7d

# Cookies
security.cookie.local=${SECURITY_COOKIE_LOCAL}
security.guest.cookie.expiration=1d
security.table.cookie.expiration=1d
security.order.cookie.expiration=1d

# Security Actions
security.registration.expiration=1d
security.change.email.expiration=1d
security.password.reset.expiration=15m

# Email
resend.api.key=${RESEND_API_KEY}
resend.domain.email=${RESEND_DOMAIN_EMAIL}

# Logging
logging.file.name=logs/app.log

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Payment
payment.monobank.x-token=${PAYMENT_MONOBANK_X_TOKEN}
payment.monobank.redirect-url=${PAYMENT_MONOBANK_REDIRECT_URL}
payment.monobank.webhook-url=${PAYMENT_MONOBANK_WEBHOOK_URL}
payment.stripe.secret-key=${PAYMENT_STRIPE_SECRET_KEY}
payment.stripe.success-url=${PAYMENT_STRIPE_SUCCESS_URL}
payment.stripe.cancel-url=${PAYMENT_STRIPE_CANCEL_URL}
payment.stripe.webhook-secret=${PAYMENT_STRIPE_WEBHOOK_SECRET}
