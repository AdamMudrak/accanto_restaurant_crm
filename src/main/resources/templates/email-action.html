<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
</head>

<body style="margin: 0;
             padding: 0;
             background-color: #f5f5f7;
             font-family: Arial, Helvetica, sans-serif;
             color: #171717;">

<table role="presentation"
       width="100%"
       cellspacing="0"
       cellpadding="0"
       border="0"
       style="width: 100%; background-color: #f5f5f7;">

    <tr>
        <td align="center" style="padding: 32px 16px;">

            <table role="presentation"
                   width="100%"
                   cellspacing="0"
                   cellpadding="0"
                   border="0"
                   style="max-width: 560px;
                          background-color: #ffffff;
                          border-radius: 24px;
                          overflow: hidden;">

                <tr>
                    <td style="padding: 36px 36px 20px 36px;">
                        <h1 style="margin: 0;
                                   font-size: 30px;
                                   line-height: 38px;">
                            {{title}}
                        </h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 0 24px 18px 24px;">

                        <table role="presentation"
                               width="100%"
                               cellspacing="0"
                               cellpadding="0"
                               border="0"
                               style="background-color: #f7f6ff;
                                      border: 1px solid #e3e0f5;
                                      border-radius: 18px;">

                            <tr>
                                <td style="padding: 26px 22px;">

                                    <p style="margin: 0 0 14px 0;
                                              font-size: 18px;
                                              line-height: 28px;">
                                        {{greeting}}
                                    </p>

                                    <p style="margin: 0;
                                              color: #555262;
                                              font-size: 15px;
                                              line-height: 24px;">
                                        {{description}}
                                    </p>

                                </td>
                            </tr>

                        </table>

                    </td>
                </tr>

                <tr>
                    <td align="center"
                        style="padding: 4px 24px 14px 24px;">

                        <a href="{{actionUrl}}"
                           style="display: block;
                                  padding: 17px 24px;
                                  background-color: #5b4be1;
                                  border-radius: 16px;
                                  color: #ffffff;
                                  font-size: 16px;
                                  font-weight: bold;
                                  text-decoration: none;
                                  text-align: center;">
                            {{button}}
                        </a>

                    </td>
                </tr>

                <tr>
                    <td style="padding: 10px 36px 28px 36px;">

                        <p style="margin: 0;
                                  color: #777382;
                                  font-size: 13px;
                                  line-height: 21px;">
                            {{securityNote}}
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
